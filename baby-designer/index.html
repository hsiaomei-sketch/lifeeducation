<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>我的未來寶寶｜生命教育創意作業</title>
<style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#403946;background:#fff9f5}*{box-sizing:border-box}body{margin:0}header{text-align:center;padding:28px 16px;background:linear-gradient(125deg,#ffeadf,#e9e6ff)}h1{margin:0;font-size:clamp(26px,4vw,42px)}header p{margin:9px 0 0;color:#645b69}.layout{max-width:1200px;margin:22px auto;padding:0 18px;display:grid;grid-template-columns:minmax(310px,1fr) minmax(350px,1fr);gap:22px}.panel{background:white;border-radius:22px;box-shadow:0 8px 32px #6c4a6318;padding:20px}.sticky{position:sticky;top:16px;align-self:start}.babybox{background:radial-gradient(circle at 50% 35%,#fff 0,#fff1ef 80%);border-radius:20px;padding:8px;min-height:410px;display:grid;place-items:center}svg{width:100%;max-width:440px;height:auto}fieldset{border:1px solid #eadde5;border-radius:15px;margin:15px 0;padding:14px}legend{font-weight:800;padding:0 7px;color:#835272}label{display:block;margin:10px 0 4px;font-size:14px;font-weight:650}select,input,textarea{width:100%;border:1px solid #dacee0;border-radius:10px;padding:10px;background:white;font:inherit;color:inherit}textarea{min-height:90px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}button{border:0;background:#8a5ba0;color:white;border-radius:12px;padding:12px 16px;font:inherit;font-weight:750;cursor:pointer}button.secondary{background:#f0e8f4;color:#613d77}small,.note{color:#726a75;font-size:13px}.note{line-height:1.65}.summary{background:#fff8fb;border:1px dashed #e6bcd0;padding:15px;border-radius:15px;white-space:pre-wrap;line-height:1.6}footer{text-align:center;color:#777;padding:20px}.eyelashes{stroke:#55424b;stroke-width:3;fill:none;stroke-linecap:round}@media(max-width:850px){.layout{grid-template-columns:1fr}.sticky{position:static}.babybox{min-height:280px}}@media print{header,.editor,.actions,footer,.note{display:none!important}.layout{display:block;margin:0}.panel{box-shadow:none}.sticky{position:static}.babybox{min-height:unset}body{background:white}}
</style></head><body><header><h1>🍼 我的未來寶寶設計師</h1><p>從頭到腳，設計你想像中的孩子，並思考每個生命的獨特性。</p></header>
<main class="layout"><section class="panel sticky"><h2>寶寶即時預覽</h2><div class="babybox">
<svg id="baby" viewBox="0 0 440 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="依照設定產生的全身卡通嬰兒">
<ellipse cx="220" cy="496" rx="110" ry="13" fill="#d8bed2" opacity=".35"/>
<g id="legs"><path id="legL" d="M184 365 Q166 402 166 445" fill="none" stroke="#ecc3a5" stroke-width="42" stroke-linecap="round"/><path id="legR" d="M256 365 Q274 402 274 445" fill="none" stroke="#ecc3a5" stroke-width="42" stroke-linecap="round"/><ellipse id="footL" cx="166" cy="462" rx="29" ry="19" fill="#ecc3a5"/><ellipse id="footR" cx="274" cy="462" rx="29" ry="19" fill="#ecc3a5"/></g>
<g id="arms"><path id="armL" d="M161 294 Q120 332 114 369" fill="none" stroke="#ecc3a5" stroke-width="35" stroke-linecap="round"/><path id="armR" d="M279 294 Q320 332 326 369" fill="none" stroke="#ecc3a5" stroke-width="35" stroke-linecap="round"/><circle id="handL" cx="114" cy="373" r="21" fill="#ecc3a5"/><circle id="handR" cx="326" cy="373" r="21" fill="#ecc3a5"/></g>
<path id="body" d="M158 278 Q220 254 282 278 Q305 316 290 387 Q220 418 150 387 Q135 316 158 278" fill="#a6c5e6" stroke="#fff" stroke-width="5"/>
<path id="bib" d="M183 276 Q220 320 257 276 Q253 323 220 340 Q187 323 183 276" fill="#fff9ea"/><circle cx="220" cy="329" r="5" fill="#f5bc91"/>
<rect x="203" y="243" width="34" height="43" rx="15" id="neck" fill="#ecc3a5"/>
<ellipse id="earL" cx="105" cy="167" rx="20" ry="30" fill="#ecc3a5"/><ellipse id="earR" cx="335" cy="167" rx="20" ry="30" fill="#ecc3a5"/>
<ellipse id="face" cx="220" cy="163" rx="111" ry="120" fill="#ecc3a5"/>
<path id="hair" d="M116 139 Q110 56 198 43 Q280 27 322 113 Q290 81 269 83 Q244 61 226 85 Q205 65 190 89 Q149 75 116 139Z" fill="#49332c"/>
<g id="brows" fill="none" stroke="#49332c" stroke-width="6" stroke-linecap="round"><path id="browL" d="M162 136 Q179 126 196 136"/><path id="browR" d="M244 136 Q261 126 278 136"/></g>
<g id="eyeL"><ellipse cx="179" cy="170" rx="15" ry="17" fill="#fff"/><circle id="irisL" cx="179" cy="172" r="10" fill="#5e4739"/><circle cx="182" cy="168" r="3" fill="#fff"/></g>
<g id="eyeR"><ellipse cx="261" cy="170" rx="15" ry="17" fill="#fff"/><circle id="irisR" cx="261" cy="172" r="10" fill="#5e4739"/><circle cx="264" cy="168" r="3" fill="#fff"/></g>
<g id="lids" fill="none" stroke="#9d6c5d" stroke-width="2.5"><path d="M163 149 Q179 143 194 149"/><path d="M246 149 Q261 143 276 149"/></g>
<path id="nose" d="M218 191 Q210 210 224 210" fill="none" stroke="#b98273" stroke-width="4" stroke-linecap="round"/>
<ellipse cx="150" cy="209" rx="20" ry="10" fill="#f3a7a4" opacity=".45"/><ellipse cx="290" cy="209" rx="20" ry="10" fill="#f3a7a4" opacity=".45"/>
<path id="mouth" d="M195 229 Q220 250 245 229" fill="none" stroke="#ae626a" stroke-width="6" stroke-linecap="round"/>
</svg></div><div id="overview" class="summary" aria-live="polite"></div>
<div class="actions"><button id="savePng">下載寶寶圖片 PNG</button><button id="print" class="secondary">列印／存成 PDF 作業</button><button id="saveJson" class="secondary">下載設計資料</button></div>
<p class="note">請先填寫學生姓名、學號、設計理念，再按「列印／存成 PDF 作業」。也可另下載寶寶圖片。資料僅留在你的瀏覽器，不會自動上傳給老師。</p></section>
<section class="panel editor"><h2>🎨 從頭到腳開始設計</h2>
<div class="two"><div><label for="student">學生姓名</label><input id="student" placeholder="請填姓名"></div><div><label for="sid">學號</label><input id="sid" placeholder="請填學號"></div></div>
<div class="two"><div><label for="babyName">寶寶暱稱</label><input id="babyName" placeholder="替寶寶取名字"></div><div><label for="babyAge">想像中的年齡</label><select id="babyAge"><option>新生兒</option><option>6 個月</option><option>1 歲</option></select></div></div>
<fieldset><legend>① 頭部與頭髮</legend><div class="two"><div><label for="skin">膚色</label><select id="skin"><option value="#f5d8bf">淺暖膚色</option><option value="#ecc3a5" selected>自然膚色</option><option value="#c88e66">健康小麥色</option><option value="#96664e">深棕膚色</option><option value="#704a38">濃棕膚色</option></select></div><div><label for="head">臉型</label><select id="head"><option value="round">圓臉</option><option value="oval">鵝蛋臉</option><option value="wide">寬臉</option></select></div></div>
<div class="two"><div><label for="hairColor">髮色</label><select id="hairColor"><option value="#49332c">深棕色</option><option value="#211d26">黑色</option><option value="#9a6545">咖啡色</option><option value="#d9aa61">金棕色</option><option value="#bd7272">紅棕色</option></select></div><div><label for="hairStyle">髮型</label><select id="hairStyle"><option value="short">短髮</option><option value="curl">捲髮</option><option value="tuft">一撮翹髮</option><option value="bald">少量頭髮</option></select></div></div>
<div class="two"><div><label for="ear">耳朵</label><select id="ear"><option value="normal">一般大小</option><option value="small">小巧</option><option value="large">較大</option></select></div><div><label for="hairNote">其他頭部特色</label><input id="hairNote" placeholder="例：有小髮旋"></div></div></fieldset>
<fieldset><legend>② 眼睛、鼻子與嘴巴</legend><div class="two"><div><label for="eyeColor">眼睛顏色</label><select id="eyeColor"><option value="#49322b">深棕</option><option value="#865b3d">淺棕</option><option value="#456f97">藍色</option><option value="#648064">綠色</option><option value="#55505f">灰色</option></select></div><div><label for="eyeSize">眼睛大小</label><select id="eyeSize"><option value="normal">適中</option><option value="big">大眼睛</option><option value="small">小眼睛</option></select></div></div>
<div class="two"><div><label for="eyelid">眼皮</label><select id="eyelid"><option value="double">雙眼皮</option><option value="single">單眼皮</option><option value="inner">內雙</option></select></div><div><label for="eyebrow">眉毛</label><select id="eyebrow"><option value="natural">自然眉</option><option value="thick">濃眉</option><option value="thin">細眉</option><option value="arched">彎彎眉</option><option value="none">淡眉</option></select></div></div>
<div class="two"><div><label for="noseType">鼻子</label><select id="noseType"><option value="round">小圓鼻</option><option value="point">挺鼻</option><option value="button">翹鼻</option></select></div><div></div></div>
<div class="two"><div><label for="mouthType">嘴巴</label><select id="mouthType"><option value="smile">微笑</option><option value="laugh">開心大笑</option><option value="small">小嘴</option><option value="pout">嘟嘴</option></select></div><div><label for="cheek">臉頰</label><select id="cheek"><option value="yes">紅潤臉頰</option><option value="no">自然臉頰</option></select></div></div></fieldset>
<fieldset><legend>③ 身體、四肢與服飾</legend><div class="two"><div><label for="bodyShape">身形</label><select id="bodyShape"><option value="normal">一般</option><option value="chubby">圓潤</option><option value="slim">纖細</option></select></div><div><label for="armLength">手臂長短</label><select id="armLength"><option value="normal">一般</option><option value="short">較短</option><option value="long">較長</option></select></div></div>
<div class="two"><div><label for="legLength">腿部長短</label><select id="legLength"><option value="normal">一般</option><option value="short">較短</option><option value="long">較長</option></select></div><div><label for="outfit">衣服顏色</label><select id="outfit"><option value="#a6c5e6">天空藍</option><option value="#efb7ca">櫻花粉</option><option value="#c3d8af">草綠</option><option value="#e2c5e8">薰衣草紫</option><option value="#efd39e">奶油黃</option></select></div></div>
<label for="bodyNote">其他從頭到腳的想像（手指、腳掌、身高、特殊特徵等）</label><textarea id="bodyNote" placeholder="每個孩子都有不同的外貌與能力，請自由描述。"></textarea></fieldset>
<fieldset><legend>④ 性格、興趣與成長期待</legend>
<div class="two"><div><label for="personality">主要性格</label><select id="personality"><option>活潑好奇</option><option>安靜細心</option><option>溫暖友善</option><option>勇敢獨立</option><option>富有創意</option><option>慢熟敏感</option></select></div><div><label for="temper">情緒表達</label><select id="temper"><option>喜歡笑</option><option>比較害羞</option><option>容易興奮</option><option>沉穩</option><option>情感豐富</option></select></div></div>
<label for="interests">希望他／她／TA 喜歡做什麼？</label><input id="interests" placeholder="例：音樂、運動、閱讀、探索世界">
<label for="values">最希望孩子擁有的三個特質</label><input id="values" placeholder="例：同理心、好奇心、勇氣">
<label for="dream">想對未來孩子說的一段話</label><textarea id="dream" placeholder="無論你和我的想像是否相同，我都希望你……"></textarea>
<label for="reflection">設計理念與反思：如果孩子與想像不同，你會如何接納？</label><textarea id="reflection" placeholder="外貌不是價值的標準；我會如何尊重孩子的獨特性？"></textarea></fieldset>
<div class="actions"><button id="reset" class="secondary">恢復預設圖案</button></div>
<p class="note">教學提醒：外貌與性格並非能依意願決定，這是一項想像與生命教育活動，不代表遺傳預測。鼓勵尊重多元樣貌，不以特徵評斷人的價值。</p></section></main>
<footer>生命教育課堂創意作業 · 每個生命，都有自己的美好</footer>
<script>
const $=id=>document.getElementById(id), ids=['student','sid','babyName','babyAge','skin','head','hairColor','hairStyle','ear','hairNote','eyeColor','eyeSize','eyelid','eyebrow','noseType','mouthType','cheek','bodyShape','armLength','legLength','outfit','bodyNote','personality','temper','interests','values','dream','reflection'];
const labels={skin:'膚色',head:'臉型',hairColor:'髮色',hairStyle:'髮型',ear:'耳朵',eyeColor:'眼睛顏色',eyeSize:'眼睛大小',eyelid:'眼皮',eyebrow:'眉毛',noseType:'鼻型',mouthType:'嘴型',bodyShape:'身形',armLength:'手臂',legLength:'腿部',outfit:'服裝'};
function selected(id){const el=$(id);return el.selectedOptions?el.selectedOptions[0].text:el.value}
function draw(){
const skin=$('skin').value,face=$('face'),head=$('head').value;
const dims=head==='oval'?[101,125]:head==='wide'?[122,112]:[111,120];face.setAttribute('rx',dims[0]);face.setAttribute('ry',dims[1]);
['face','earL','earR','neck','handL','handR','footL','footR'].forEach(id=>$(id).setAttribute('fill',skin));
const earScale={small:.75,normal:1,large:1.3}[$('ear').value];['earL','earR'].forEach(id=>{$(id).setAttribute('rx',20*earScale);$(id).setAttribute('ry',30*earScale)});
const arm=$('armLength').value,leg=$('legLength').value;
const armY={short:348,normal:373,long:406}[arm],legY={short:421,normal:462,long:484}[leg];
['L','R'].forEach((side)=>{const left=side==='L',x=left?114:326,lx=left?166:274;const a=$('arm'+side);a.setAttribute('d','M'+(left?161:279)+' 294 Q'+(left?120:320)+' 332 '+x+' '+(armY-4));a.setAttribute('stroke',skin);$('hand'+side).setAttribute('cy',armY);const l=$('leg'+side);l.setAttribute('d','M'+(left?184:256)+' 365 Q'+lx+' '+(legY-60)+' '+lx+' '+(legY-17));l.setAttribute('stroke',skin);$('foot'+side).setAttribute('cy',legY)});
const b=$('body');b.setAttribute('fill',$('outfit').value);const shape=$('bodyShape').value;b.setAttribute('d',shape==='chubby'?'M152 278 Q220 250 288 278 Q327 335 300 395 Q220 431 140 395 Q113 335 152 278':shape==='slim'?'M169 278 Q220 258 271 278 Q286 320 273 388 Q220 409 167 388 Q154 320 169 278':'M158 278 Q220 254 282 278 Q305 316 290 387 Q220 418 150 387 Q135 316 158 278');
const hair=$('hair');hair.setAttribute('fill',$('hairColor').value);
hair.setAttribute('d',({short:'M116 139 Q110 56 198 43 Q280 27 322 113 Q290 81 269 83 Q244 61 226 85 Q205 65 190 89 Q149 75 116 139Z',curl:'M116 138 Q90 109 119 93 Q108 60 146 58 Q160 25 191 48 Q215 14 246 42 Q281 21 292 61 Q334 62 322 113 Q285 83 258 92 Q230 70 203 90 Q163 75 116 138Z',tuft:'M116 139 Q110 56 198 43 Q200 20 188 9 Q231 13 231 43 Q285 30 322 113 Q273 77 247 89 Q203 70 180 91 Q149 75 116 139Z',bald:'M205 60 Q219 35 230 60 Q224 55 218 65 Z'})[$('hairStyle').value]);
['L','R'].forEach(side=>{const eye=$('eye'+side);eye.setAttribute('transform','translate('+(side==='L'?179:261)+' 170) scale('+({small:.75,normal:1,big:1.3}[$('eyeSize').value])+') translate('+(side==='L'?-179:-261)+' -170)');$('iris'+side).setAttribute('fill',$('eyeColor').value)});
$('lids').style.opacity=$('eyelid').value==='single'?'0':$('eyelid').value==='inner'?'0.45':'1';
const browStyle=$('eyebrow').value,brow=$('brows');
brow.style.opacity=browStyle==='none'?'0.18':'1';
brow.setAttribute('stroke-width',browStyle==='thick'?'9':browStyle==='thin'?'3.5':'6');
const browPath=browStyle==='arched'?['M162 140 Q179 119 196 140','M244 140 Q261 119 278 140']:browStyle==='thin'?['M163 135 Q179 131 195 135','M245 135 Q261 131 277 135']:['M162 136 Q179 126 196 136','M244 136 Q261 126 278 136'];
$('browL').setAttribute('d',browPath[0]);$('browR').setAttribute('d',browPath[1]);
$('nose').setAttribute('d',({round:'M218 191 Q210 210 224 210',point:'M218 189 L216 213 Q220 218 229 210',button:'M220 191 Q209 209 224 208 Q231 205 227 201'})[$('noseType').value]);
$('mouth').setAttribute('d',({smile:'M195 229 Q220 250 245 229',laugh:'M194 226 Q220 271 246 226 Q222 234 194 226Z',small:'M210 234 Q220 241 230 234',pout:'M203 236 Q211 227 220 235 Q229 227 238 236 Q221 244 203 236Z'})[$('mouthType').value]);
$('mouth').setAttribute('fill',$('mouthType').value==='laugh'?'#aa6370':'none');
document.querySelectorAll('ellipse[cx="150"],ellipse[cx="290"]').forEach(e=>e.style.opacity=$('cheek').value==='yes'?.45:0);
let text='學生：'+($('student').value||'尚未填寫')+'　學號：'+($('sid').value||'尚未填寫')+'\n寶寶暱稱：'+($('babyName').value||'未命名')+'　年齡：'+selected('babyAge')+'\n';
Object.keys(labels).forEach(k=>text+=labels[k]+'：'+selected(k)+'　');
text+='\n性格：'+selected('personality')+'｜情緒：'+selected('temper')+'\n興趣：'+($('interests').value||'未填寫')+'\n期待特質：'+($('values').value||'未填寫')+'\n其他頭部特色：'+($('hairNote').value||'未填寫')+'\n其他身體特色：'+($('bodyNote').value||'未填寫')+'\n給孩子的話：'+($('dream').value||'未填寫')+'\n接納與反思：'+($('reflection').value||'未填寫');
$('overview').textContent=text;
}
function filename(){return (($('sid').value||'學號')+'_'+($('student').value||'學生')+'_我的未來寶寶').replace(/[\\/:*?"<>|]/g,'_')}
function download(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
ids.forEach(id=>$(id).addEventListener('input',draw));
$('reset').onclick=()=>{ids.filter(id=>!['student','sid'].includes(id)).forEach(id=>{const e=$(id);if(e.tagName==='SELECT')e.selectedIndex=0;else e.value=''});draw()};
$('print').onclick=()=>window.print();
$('saveJson').onclick=()=>download(new Blob([JSON.stringify(Object.fromEntries(ids.map(id=>[id,$(id).value])),null,2)],{type:'application/json;charset=utf-8'}),filename()+'.json');
$('savePng').onclick=()=>{const svg=$('baby').cloneNode(true);svg.setAttribute('xmlns','http://www.w3.org/2000/svg');const xml=new XMLSerializer().serializeToString(svg);const img=new Image(),url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml'}));img.onload=()=>{const canvas=document.createElement('canvas');canvas.width=880;canvas.height=1040;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff9f5';ctx.fillRect(0,0,880,1040);ctx.drawImage(img,0,0,880,1040);canvas.toBlob(blob=>{if(blob)download(blob,filename()+'.png');URL.revokeObjectURL(url)},'image/png')};img.src=url};
draw();
</script></body></html>
